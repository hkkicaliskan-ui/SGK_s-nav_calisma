<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Okuma Uygulaması v3.2</title>
    <!-- Gerekli Kütüphaneler: Word, Excel ve PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --accent: #ff4757;
            --accent-blue: #3b82f6;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .screen.active {
            display: block;
        }

        /* YÜKLEME EKRANI */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            font-family: 'Segoe UI', sans-serif;
        }

        h1, h2 {
            margin-bottom: 1.5rem;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-family: 'Segoe UI', sans-serif;
        }

        input[type="file"], textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: sans-serif;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .filter-info {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--accent-blue);
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }

        button:hover {
            opacity: 0.9;
        }

        /* OKUMA EKRANI */
        .reader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .display-box {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center; /* Tam Ortalandı */
            text-align: center;
            font-size: 4rem;
            font-weight: bold;
            position: relative;
            border: 2px solid var(--border);
            margin-bottom: 2rem;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .display-box::before, .display-box::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 25px;
            background-color: var(--accent);
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.6;
            z-index: 1;
        }

        .display-box::before { top: 10px; }
        .display-box::after { bottom: 10px; }

        .orp-letter {
            color: var(--accent);
            position: relative;
        }

        .controls {
            width: 100%;
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .preset-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: #334155;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .preset-btn.active {
            background: var(--accent-blue);
        }

        .speed-slider-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .speed-slider-group input {
            flex: 1;
        }

        #speed-label {
            min-width: 80px;
            text-align: right;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 0.1s linear;
        }

        .finished-msg {
            font-size: 2rem;
            color: #94a3b8;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>

    <!-- 1. ARAYÜZ: KAYNAK VE METİN EKLEME -->
    <div id="setup-screen" class="screen active">
        <div class="card">
            <h1>Metin Kaynağı Seçimi</h1>
            
            <div class="input-group">
                <label>Dosyadan İçe Aktar (.txt, .docx, .xlsx, .pdf)</label>
                <input type="file" id="file-input" accept=".txt, .docx, .xlsx, .pdf">
            </div>

            <div class="filter-info">
                ℹ️ <strong>Dipnot Filtresi Aktif:</strong> Sayfa altı açıklamaları, dipnotlar ve sayfa numaraları otomatik ayıklanır.
            </div>

            <div class="input-group">
                <label>Veya Metni Doğrudan Yapıştırın</label>
                <textarea id="text-input" placeholder="Çalışmak istediğiniz metni buraya yapıştırın..."></textarea>
            </div>

            <div class="btn-group">
                <button onclick="startReading()">Okuma Moduna Geç</button>
            </div>
        </div>
    </div>

    <!-- 2. ARAYÜZ: HIZLI OKUMA ÇALIŞMA ALANI -->
    <div id="reader-screen" class="screen">
        <div class="reader-container">
            <div class="display-box" id="word-display-container">
                <span id="word-display">Hazır</span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="controls" style="margin-top: 1rem;">
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setSpeedPreset(200, this)">Acemi (200)</button>
                    <button class="preset-btn active" onclick="setSpeedPreset(400, this)">Orta (400)</button>
                    <button class="preset-btn" onclick="setSpeedPreset(700, this)">Usta (700)</button>
                    <button class="preset-btn" onclick="setSpeedPreset(1000, this)">Hiper (1000)</button>
                </div>

                <div class="speed-slider-group">
                    <label>Hız ayarı:</label>
                    <input type="range" id="speed-range" min="100" max="1500" step="25" value="400" oninput="updateSpeedFromSlider(this.value)">
                    <span id="speed-label">400 KDK</span>
                </div>

                <div class="btn-group" style="justify-content: center; flex-wrap: wrap;">
                    <button id="play-btn" onclick="togglePlay()" style="min-width: 120px;">Başlat</button>
                    <button onclick="resetReader()" style="background-color: #64748b;">Başa Dön</button>
                    <button onclick="showSetup()" style="background-color: #475569;">Kaynak Değiştir</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let words = [];
        let currentIndex = 0;
        let isPlaying = false;
        let intervalId = null;
        let wpm = 400;

        // --- Gelişmiş Metin Temizleme ve Dipnot Filtreleme ---
        function filterFooterAndFootnotes(text) {
            if (!text) return "";

            let lines = text.split(/\r?\n/);
            let cleanedLines = [];

            for (let line of lines) {
                let trimmed = line.trim();
                if (!trimmed) continue;

                if (/^(sayfa|page|s\.)\s*\d+/i.test(trimmed) || /^\d+\s*\/\s*\d+$/.test(trimmed)) {
                    continue;
                }
                if (/^(\[\d+\]|\d+\.|\*|†|‡)\s+/.test(trimmed) && trimmed.length < 120) {
                    continue;
                }
                if (/^(bkz|bakınız|kaynak|dipnot|not)\s*:/i.test(trimmed)) {
                    continue;
                }
                if (/^(copyright|tüm hakları|all rights reserved)/i.test(trimmed)) {
                    continue;
                }

                cleanedLines.push(trimmed);
            }

            return cleanedLines.join(" ");
        }

        // --- Dosya Okuma İşlemleri ---
        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            const inputTextArea = document.getElementById('text-input');
            inputTextArea.value = "Dosya işleniyor...";

            try {
                if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const viewport = page.getViewport({ scale: 1.0 });
                        
                        let pageLines = [];
                        textContent.items.forEach(item => {
                            let yPosition = item.transform[5];
                            let pageHeight = viewport.height;

                            if (yPosition > (pageHeight * 0.15)) {
                                pageLines.push(item.str);
                            }
                        });

                        fullText += pageLines.join(" ") + "\n";
                    }

                    inputTextArea.value = filterFooterAndFootnotes(fullText);

                } else if (ext === 'txt') {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        inputTextArea.value = filterFooterAndFootnotes(event.target.result);
                    };
                    reader.readAsText(file);

                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    inputTextArea.value = filterFooterAndFootnotes(result.value);

                } else if (ext === 'xlsx') {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data);
                    let extractedText = "";
                    
                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        json.forEach(row => {
                            if (row.length > 0) extractedText += row.join(" ") + "\n";
                        });
                    });
                    inputTextArea.value = filterFooterAndFootnotes(extractedText);
                }
            } catch (error) {
                inputTextArea.value = "Dosya işlenirken hata oluştu.";
                console.error(error);
            }
        });

        // --- Okuma Mantığı ve Ekran Düzeni ---
        function startReading() {
            let rawText = document.getElementById('text-input').value.trim();
            if (!rawText || rawText.startsWith("Dosya işleniyor")) {
                alert("Lütfen geçerli bir metin kaynağı sağlayın.");
                return;
            }

            rawText = filterFooterAndFootnotes(rawText);
            words = rawText.replace(/\s+/g, ' ').split(' ').filter(w => w.length > 0);
            currentIndex = 0;

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('reader-screen').classList.add('active');
            
            pause();
            updateDisplay();
        }

        function showSetup() {
            pause();
            document.getElementById('reader-screen').classList.remove('active');
            document.getElementById('setup-screen').classList.add('active');
        }

        function getEmphasisLength(wordLen) {
            if (wordLen < 5) return 1;
            if (wordLen < 9) return 2;
            return 3;
        }

        function formatWordCentered(word) {
            const len = word.length;
            if (len === 0) return "";
            
            const empLen = getEmphasisLength(len);
            const startIndex = Math.floor((len - empLen) / 2);
            
            const leftPart = word.substring(0, startIndex);
            const middlePart = word.substring(startIndex, startIndex + empLen);
            const rightPart = word.substring(startIndex + empLen);

            return `<span>${leftPart}</span><span class="orp-letter">${middlePart}</span><span>${rightPart}</span>`;
        }

        function updateDisplay() {
            const displaySpan = document.getElementById('word-display');
            
            if (currentIndex < words.length) {
                const currentWord = words[currentIndex];
                displaySpan.innerHTML = formatWordCentered(currentWord);

                const progress = ((currentIndex + 1) / words.length) * 100;
                document.getElementById('progress-bar').style.width = progress + "%";
            } else {
                pause();
                displaySpan.innerHTML = '<span class="finished-msg">Tamamlandı</span>';
            }
        }

        // --- Kontrol Mekanizmaları ---
        function togglePlay() {
            if (isPlaying) pause(); else play();
        }

        function play() {
            if (words.length === 0) return;
            if (currentIndex >= words.length) currentIndex = 0;
            
            isPlaying = true;
            document.getElementById('play-btn').innerText = "Duraklat";
            document.getElementById('play-btn').style.backgroundColor = "#e17055";
            
            runTimer();
        }

        function runTimer() {
            if (intervalId) clearInterval(intervalId);
            const delay = (60 / wpm) * 1000;
            
            intervalId = setInterval(() => {
                currentIndex++;
                if (currentIndex < words.length) {
                    updateDisplay();
                } else {
                    updateDisplay();
                }
            }, delay);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('play-btn').innerText = "Başlat";
            document.getElementById('play-btn').style.backgroundColor = "var(--accent-blue)";
            if (intervalId) clearInterval(intervalId);
        }

        function resetReader() {
            pause();
            currentIndex = 0;
            updateDisplay();
        }

        function setSpeedPreset(speed, element) {
            wpm = speed;
            document.getElementById('speed-range').value = speed;
            document.getElementById('speed-label').innerText = speed + " KDK";
            
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');

            if (isPlaying) runTimer();
        }

        function updateSpeedFromSlider(val) {
            wpm = parseInt(val);
            document.getElementById('speed-label').innerText = val + " KDK";
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));

            if (isPlaying) runTimer();
        }
    </script>
</body>
</html>
